[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-automation-patterns"
version = "0.1.0"
description = "Reliable AI-assisted workflow reference with approvals and idempotency"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Codhaus"}]
keywords = ["ai", "automation", "workflow", "ollama", "human-in-the-loop", "idempotency"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
ai-workflow-demo = "ai_workflow_patterns.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
